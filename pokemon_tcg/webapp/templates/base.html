<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ title or "Pokemon TCG" }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">PT</div>
      <div>
        <div class="brand-title">Pokemon TCG AI</div>
        <div class="brand-sub">Director Dashboard &middot; v0.2</div>
      </div>
    </div>
    <nav class="nav">
      {% for href, label in nav %}
        <a href="{{ href }}" class="nav-link {% if request.path == href %}active{% endif %}">{{ label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footnote">
    Pokemon TCG AI Battle Challenge &middot; self-hosted Flask dashboard.
  </footer>
</body>
</html>
